name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  vercel-function-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checar limite de Serverless Functions (plano Hobby = 12)
        run: |
          count=$(find backend/api -maxdepth 1 -name '*.ts' ! -name '*.test.ts' | wc -l)
          echo "Funções deployáveis em backend/api: $count (limite Hobby: 12)"
          if [ "$count" -gt 12 ]; then
            echo "::error::backend/api tem $count funções (*.ts, exceto *.test.ts) — excede o limite de 12 do plano Hobby da Vercel. Veja docs/modules/backend_core.md."
            exit 1
          fi
